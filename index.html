<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TuneWave - Home</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">🎵 TuneWave</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="premium.html">Premium</a></li>
      <li><a href="liked.html">Liked</a></li>
      <li><a href="about.html">About</a></li>
      <li><a id="profileNavLink" href="login.html">Login</a></li>
    </ul>
    <button class="theme-toggle" id="themeToggle">☀ Light</button>
  </nav>

  <!-- Hero / Search -->
  <section class="hero">
    <h1>Find your next favorite song</h1>
    <input type="text" id="searchInput" class="search-bar" placeholder="Search songs or artists...">
  </section>

  <!-- Categories -->
  <div class="categories">
    <div class="category-chip active" data-category="All">All</div>
    <div class="category-chip" data-category="Pop">Pop</div>
    <div class="category-chip" data-category="Hip-Hop">Hip-Hop</div>
    <div class="category-chip" data-category="Rock">Rock</div>
    <div class="category-chip" data-category="Classical">Classical</div>
  </div>

  <!-- Song Grid -->
  <div class="song-grid" id="songGrid"></div>

  <!-- Mini Player Bar -->
  <div class="player-bar">
    <div class="player-info">
      <img id="playerCover" src="https://picsum.photos/seed/default/100" alt="cover">
      <div>
        <div id="playerTitle" class="song-title">No song playing</div>
        <div id="playerArtist" class="song-artist">-</div>
      </div>
    </div>
    <div class="player-controls">
      <button id="prevBtn">⏮</button>
      <button id="playPauseBtn">▶</button>
      <button id="nextBtn">⏭</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="player.js"></script>
</body>
</html>
