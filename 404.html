<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TuneWave - Page Not Found</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="style.css">
<style>
  .notfound-wrap { text-align: center; padding: 100px 20px; }
  .notfound-wrap h1 { font-size: 80px; color: var(--accent); margin-bottom: 10px; }
  .notfound-wrap p { color: var(--muted); margin-bottom: 25px; }
  .notfound-wrap a { background: var(--accent); color: #fff; padding: 10px 22px; border-radius: 25px; }
</style>
</head>
<body data-theme="dark">

  <nav class="navbar">
    <div class="logo">🎵 TuneWave</div>
    <button class="theme-toggle" id="themeToggle">☀ Light</button>
  </nav>

  <div class="notfound-wrap">
    <h1>404</h1>
    <p>Oops! The page you're looking for doesn't exist.</p>
    <a href="index.html">Back to Home</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
