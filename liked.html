<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TuneWave - Liked Songs</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="style.css">
<style>
  #likedEmptyMsg { text-align: center; color: var(--muted); padding: 40px; display: none; }
</style>
</head>
<body data-theme="dark">

  <nav class="navbar">
    <div class="logo">🎵 TuneWave</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="premium.html">Premium</a></li>
      <li><a href="about.html">About</a></li>
      <li><a id="profileNavLink" href="login.html">Login</a></li>
    </ul>
    <button class="theme-toggle" id="themeToggle">☀ Light</button>
  </nav>

  <section class="hero">
    <h1>Your Liked Songs</h1>
  </section>

  <p id="likedEmptyMsg">You haven't liked any songs yet. Go to <a href="index.html">Home</a> and tap ♥ on a song.</p>
  <div class="song-grid" id="likedGrid"></div>

  <!-- Mini Player Bar -->
  <div class="player-bar">
    <div class="player-info">
      <img id="playerCover" src="https://picsum.photos/seed/default/100" alt="cover">
      <div>
        <div id="playerTitle" class="song-title">No song playing</div>
        <div id="playerArtist" class="song-artist">-</div>
      </div>
    </div>
    <div class="player-controls">
      <button id="prevBtn">⏮</button>
      <button id="playPauseBtn">▶</button>
      <button id="nextBtn">⏭</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="player.js"></script>
  <script src="liked.js"></script>
</body>
</html>
